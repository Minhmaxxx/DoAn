[theme]
base = "light"
primaryColor = "#19352a"
backgroundColor = "#f3f0e7"
secondaryBackgroundColor = "#fffdf7"
textColor = "#17251e"
font = "sans serif"
[server]
maxUploadSize = 20
enableStaticServing = true

[browser]
gatherUsageStats = false

[runner]
# Force UTF-8 on Windows
magicEnabled = true
