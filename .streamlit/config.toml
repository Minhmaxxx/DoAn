primaryColor = "#4ECDC4"
backgroundColor = "#0e0e18"
secondaryBackgroundColor = "#1a1a2e"
textColor = "#e0e0e0"
font = "sans serif"
[server]
headless = false
address = "localhost"
port = 8501

[browser]
gatherUsageStats = false

[runner]
