# training/dataset.yaml
# YOLOv8 Dataset Configuration for NutriVision
# Place this file in your dataset root directory OR use the one exported by Roboflow

# ─── Dataset Paths ───────────────────────────────────────────────────────────
# (Roboflow will auto-generate paths when you export)
path: ../datasets/nutrivision  # Dataset root (relative to ultralytics working dir)
train: images/train
val: images/valid
test: images/test

# ─── Classes ─────────────────────────────────────────────────────────────────
nc: 12  # Number of classes

names:
  0: banh_mi
  1: banh_trang_nuong
  2: banh_xeo
  3: bun_bo_hue
  4: bun_dau_mam_tom
  5: bun_rieu
  6: bun_thit_nuong
  7: chao_long
  8: com_tam
  9: goi_cuon
  10: pho
  11: xoi

# ─── Notes ───────────────────────────────────────────────────────────────────
# Dataset collected and labeled via Roboflow
# Augmentation applied: Rotation, Brightness, Mosaic, Flip
# Split: 70% train / 20% val / 10% test
# Canonical class IDs follow the deployed Baseline B index order.
